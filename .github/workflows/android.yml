name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.9"
  CARGO_TERM_COLOR: always

jobs:
  # Fast, isolated feedback: vault format, crypto, TOTP (RFC 6238 vectors), autofill matching.
  core:
    name: Core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the core crate
        run: cargo test -p passvault-core

  # The Brave/Chrome extension: Argon2id against the RFC 9106 vectors, vault opening, TOTP vectors.
  extension:
    name: Browser extension
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test
        run: npm test
        working-directory: browser-extension
      - name: Package
        run: |
          cd browser-extension
          zip -r ../passvault-extension.zip manifest.json background.js popup.html popup.css popup.js src icons
      - uses: actions/upload-artifact@v7
        with:
          name: passvault-brave-extension
          path: passvault-extension.zip

  android:
    name: Build the Android app
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # lets tagged builds publish a GitHub Release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      # Slint's Android backend build script needs an android.jar from an installed SDK platform.
      # Make sure one exists, then point the build script straight at it.
      - name: Ensure an Android SDK platform is installed
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          ls -la "$SDK/platforms" 2>&1 || true
          if [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            SDKMANAGER="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
            yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-35"
          fi
          test -f "$SDK/platforms/android-35/android.jar"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$SDK/platforms/android-35/android.jar" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the Rust library for Android
        run: cargo ndk --platform 26 -t arm64-v8a -t x86_64 -o android/app/src/main/jniLibs build --release --package passvault

      - name: Add libc++_shared.so in case the build needs it
        run: |
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib"
          JNI=android/app/src/main/jniLibs
          copy() { [ -f "$SYSROOT/$1/libc++_shared.so" ] && cp "$SYSROOT/$1/libc++_shared.so" "$JNI/$2/"; return 0; }
          copy aarch64-linux-android arm64-v8a
          copy x86_64-linux-android x86_64
          ls -l "$JNI"/*/

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build the debug APK
        run: gradle -p android assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: passvault-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---- Tagged builds (v1.0.0 and so on): signed release ----
      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD repository secrets (see README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK and AAB
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          export VERSION_CODE="${{ github.run_number }}"
          gradle -p android assembleRelease bundleRelease --stacktrace

      - name: Remove keystore
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
